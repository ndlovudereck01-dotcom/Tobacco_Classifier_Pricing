name: Django CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    services:
      # If you need PostgreSQL/MySQL, add a service container.
      # For simplicity we use SQLite here.
      # Example for postgres:
      # postgres:
      #   image: postgres:15
      #   env:
      #     POSTGRES_USER: django
      #     POSTGRES_PASSWORD: django
      #     POSTGRES_DB: test_db
      #   ports: ['5432:5432']
      #   options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'  # cache pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install dev tools
          pip install ruff pytest pytest-django

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-prod
          DATABASE_URL: sqlite:///db.sqlite3  # or your real DB URL
        run: pytest

      - name: Check for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit
